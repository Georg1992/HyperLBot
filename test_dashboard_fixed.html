<!DOCTYPE html>
<html>
<head>
    <title>HyperLBot Dashboard - Fixed</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; border-left: 4px solid #4CAF50; }
        .card h3 { margin-top: 0; color: #4CAF50; }
        .rsi-value { font-size: 16px; font-weight: bold; color: #2196F3; }
        .volume-value { font-size: 16px; font-weight: bold; color: #FF9800; }
        .orderbook-table { font-family: monospace; font-size: 11px; }
        .ask-row { background: rgba(244, 67, 54, 0.1); color: #f44336; }
        .bid-row { background: rgba(76, 175, 80, 0.1); color: #4CAF50; }
        .orderbook-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 2px 5px; text-align: right; }
        .spread-info { background: #2d2d2d; padding: 5px; text-align: center; color: #FF9800; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 HyperLBot Dashboard - Fixed Version</h1>
            <button onclick="loadData()">🔄 Refresh Data</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <h3>📊 Session Status</h3>
                <div id="session-data">Loading...</div>
            </div>
            <div class="card">
                <h3>💰 Market Status</h3>
                <div id="market-data">Loading...</div>
            </div>
            <div class="card">
                <h3>📈 Trading Summary</h3>
                <div id="summary-data">Loading...</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="card">
                <h3>🎯 Live Trading Predictions</h3>
                <div id="predictions-data">Loading...</div>
            </div>
            <div class="card">
                <h3>📊 Live Orderbook</h3>
                <div id="orderbook-data">Loading...</div>
            </div>
        </div>
        
        <div class="card">
            <h3>📝 Latest Activity</h3>
            <div id="logs-data">Loading...</div>
        </div>
    </div>

    <script>
        function loadData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    updateMarketStatus(data.market);
                    updateOrderbook(data.orderbook);
                    updatePredictions(data.predictions);
                    updateSummary(data.summary);
                    updateSession(data.session);
                })
                .catch(error => console.error('Error:', error));
        }
        
        function updateMarketStatus(market) {
            const div = document.getElementById('market-data');
            if (market) {
                div.innerHTML = `
                    <p><strong>Price:</strong> $${market.hyperliquid_price ? market.hyperliquid_price.toLocaleString() : 'N/A'}</p>
                    <p><strong>📊 RSI:</strong> <span class="rsi-value">${market.rsi ? market.rsi.toFixed(1) : 'N/A'}</span></p>
                    <p><strong>📈 Volume:</strong> <span class="volume-value">${market.volume_depth ? market.volume_depth.toFixed(1) : 'N/A'} BTC</span></p>
                    <p><strong>Flow:</strong> ${market.orderbook_imbalance ? (market.orderbook_imbalance * 100).toFixed(1) + '%' : 'N/A'}</p>
                `;
            }
        }
        
        function updateOrderbook(orderbook) {
            const div = document.getElementById('orderbook-data');
            if (orderbook && orderbook.bids && orderbook.asks) {
                let html = '<div class="orderbook-table">';
                html += '<div class="orderbook-row"><div><strong>Price</strong></div><div><strong>Size</strong></div><div><strong>Total</strong></div></div>';
                
                // Show top 8 asks (reverse order)
                orderbook.asks.slice(0, 8).reverse().forEach(ask => {
                    html += `<div class="orderbook-row ask-row"><div>${ask.price.toFixed(0)}</div><div>${ask.size.toFixed(4)}</div><div>${ask.total.toFixed(2)}</div></div>`;
                });
                
                html += `<div class="spread-info">Spread: $${orderbook.spread.toFixed(2)}</div>`;
                
                // Show top 8 bids
                orderbook.bids.slice(0, 8).forEach(bid => {
                    html += `<div class="orderbook-row bid-row"><div>${bid.price.toFixed(0)}</div><div>${bid.size.toFixed(4)}</div><div>${bid.total.toFixed(2)}</div></div>`;
                });
                
                html += '</div>';
                div.innerHTML = html;
            } else {
                div.innerHTML = '<p>❌ No orderbook data</p>';
            }
        }
        
        function updatePredictions(predictions) {
            const div = document.getElementById('predictions-data');
            if (predictions && predictions.length > 0) {
                let html = '';
                predictions.forEach(pred => {
                    html += `
                        <div style="background: #1a1a1a; padding: 10px; margin: 5px 0; border-radius: 5px; border-left: 4px solid ${pred.side === 'BUY' ? '#4CAF50' : '#f44336'};">
                            <strong>${pred.type} - ${pred.side}</strong><br>
                            Entry: $${pred.entry_price ? pred.entry_price.toFixed(2) : 'N/A'}<br>
                            Current: $${pred.current_price ? pred.current_price.toFixed(2) : 'N/A'}<br>
                            Confidence: ${(pred.confidence * 100).toFixed(1)}%<br>
                            Timeframe: ${pred.timeframe || 'N/A'} min
                        </div>
                    `;
                });
                div.innerHTML = html;
            } else {
                div.innerHTML = '<p>No predictions</p>';
            }
        }
        
        function updateSummary(summary) {
            document.getElementById('summary-data').innerHTML = `
                <p>Trades: ${summary.total_trades || 0}</p>
                <p>Balance: $${summary.current_balance ? summary.current_balance.toFixed(2) : '120.00'}</p>
            `;
        }
        
        function updateSession(session) {
            document.getElementById('session-data').innerHTML = `
                <p>Session: ${session.session_id || 'N/A'}</p>
                <p>Strategy: ${session.strategy || 'N/A'}</p>
            `;
        }
        
        // Auto-refresh every 2 seconds
        setInterval(loadData, 2000);
        loadData();
    </script>
</body>
</html>
