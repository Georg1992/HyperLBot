
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLBot Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        .card h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-running { background: #4CAF50; }
        .status-stopped { background: #f44336; }
        .status-warning { background: #ff9800; }
        .log-entry {
            background: #1a1a1a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
            font-family: monospace;
            font-size: 12px;
        }
        .trade-entry {
            border-left-color: #2196F3;
        }
        .signal-entry {
            border-left-color: #FF9800;
        }
        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        .refresh-btn:hover {
            background: #45a049;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        .trend-up { color: #4CAF50; }
        .trend-down { color: #f44336; }
        .trend-neutral { color: #ff9800; }
        .warning { color: #ff9800; font-weight: bold; }
        
        /* Optimized prediction styles */
        .prediction-card {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #4CAF50;
            font-family: monospace;
            font-size: 12px;
        }
        .prediction-buy { border-left-color: #4CAF50; }
        .prediction-sell { border-left-color: #f44336; }
        .high-confidence { box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3); }
        .medium-confidence { box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3); }
        .low-confidence { box-shadow: 0 2px 8px rgba(244, 67, 54, 0.3); }
        
        /* Market indicators */
        .market-indicator {
            background: rgba(76, 175, 80, 0.1);
            border-radius: 6px;
            padding: 8px;
            margin: 8px 0;
            border-left: 3px solid #4CAF50;
        }
        .rsi-indicator { border-left-color: #2196F3; background: rgba(33, 150, 243, 0.1); }
        .volume-indicator { border-left-color: #FF9800; background: rgba(255, 152, 0, 0.1); }
        
        /* Orderbook styles */
        .orderbook-container {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            background: #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
        }
        .orderbook-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #2d2d2d;
            padding: 8px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 3px 8px;
            text-align: right;
            border-bottom: 1px solid #333333;
        }
        .bid-row { background: rgba(76, 175, 80, 0.05); }
        .ask-row { background: rgba(244, 67, 54, 0.05); }
        .bid-price { color: #4CAF50; font-weight: bold; }
        .ask-price { color: #f44336; font-weight: bold; }
        .spread-info {
            background: #2d2d2d;
            padding: 8px;
            text-align: center;
            border-top: 1px solid #333;
            color: #FF9800;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 HyperLBot Dashboard</h1>
            <p>Optimized Real-time Trading Monitor</p>
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
            <div id="update-indicator" style="margin-top: 10px; font-size: 12px; color: #4CAF50;">🔄 Loading...</div>
        </div>
        
        <div class="grid">
            <div class="card">
                <h3>📊 Session Status</h3>
                <div id="session-status">
                    <p><span class="status-indicator status-running"></span>Loading...</p>
                </div>
            </div>
            
            <div class="card">
                <h3>💰 Market Status</h3>
                <div id="market-status">
                    <p>Loading...</p>
                </div>
            </div>
            
            <div class="card">
                <h3>📊 Live Orderbook</h3>
                <div id="orderbook-panel">
                    <p>Loading orderbook...</p>
                </div>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="card">
                <h3>🎯 Trading Predictions</h3>
                <div id="predictions-panel">
                    <p>Loading predictions...</p>
                </div>
            </div>
            
            <div class="card">
                <h3>📈 Trading Summary</h3>
                <div id="trading-summary">
                    <p>Loading...</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3>📝 Latest Activity</h3>
            <div id="latest-logs">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Dashboard state management
        const DashboardManager = {
            refreshInterval: null,
            isUpdating: false,
            errorCount: 0,
            maxErrors: 5,
            
            init() {
                this.refreshData();
                this.startAutoRefresh();
            },
            
            startAutoRefresh() {
                // Smart refresh: slower when errors, faster when working
                const interval = this.errorCount > 2 ? 5000 : 2000;
                this.refreshInterval = setInterval(() => this.refreshData(), interval);
            },
            
            stopAutoRefresh() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                    this.refreshInterval = null;
                }
            },
            
            async refreshData() {
                if (this.isUpdating) return; // Prevent overlapping requests
                
                this.isUpdating = true;
                this.updateIndicator('⏳ Updating...', '#ff9800');
                
                try {
                    const response = await fetch('/api/status');
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    // Update all panels
                    this.updateSessionStatus(data.session);
                    this.updateMarketStatus(data.market);
                    this.updateTradingSummary(data.summary);
                    this.updateLatestLogs(data.logs);
                    this.updatePredictionsPanel(data.predictions);
                    this.updateOrderbook(data.orderbook);
                    
                    // Success
                    this.errorCount = 0;
                    const now = new Date().toLocaleTimeString();
                    this.updateIndicator(`✅ Updated: ${now}`, '#4CAF50');
                    
                } catch (error) {
                    console.error('Error fetching data:', error);
                    this.errorCount++;
                    this.updateIndicator(`❌ Error (${this.errorCount}/${this.maxErrors})`, '#f44336');
                    
                    // Stop auto-refresh if too many errors
                    if (this.errorCount >= this.maxErrors) {
                        this.stopAutoRefresh();
                        this.updateIndicator('❌ Auto-refresh stopped - too many errors', '#f44336');
                    }
                } finally {
                    this.isUpdating = false;
                }
            },
            
            updateIndicator(message, color) {
                const indicator = document.getElementById('update-indicator');
                if (indicator) {
                    indicator.innerHTML = message;
                    indicator.style.color = color;
                }
            },
            
            updateSessionStatus(session) {
                const div = document.getElementById('session-status');
                if (!session || !session.session_id) {
                    div.innerHTML = '<p><span class="status-indicator status-stopped"></span>No active session</p>';
                    return;
                }
                
                // Determine status display
                let statusClass, statusIcon, statusText;
                if (session.status === 'ACTIVE') {
                    statusClass = 'status-running';
                    statusIcon = '🔴';
                    statusText = 'Live Trading';
                } else if (session.status === 'STOPPED' || session.status === 'COMPLETED') {
                    statusClass = 'status-warning';
                    statusIcon = '⏸️';
                    statusText = 'Bot Stopped';
                } else if (session.status === 'WAITING') {
                    statusClass = 'status-stopped';
                    statusIcon = '⚪';
                    statusText = 'No Session';
                } else {
                    statusClass = 'status-stopped';
                    statusIcon = '❌';
                    statusText = 'Unknown Status';
                }
                
                const statusMessage = session.status === 'STOPPED' || session.status === 'COMPLETED' ? 
                    '<p style="color: #ff9800; font-size: 11px;">⏸️ Last trading session - Start bot for new session</p>' : 
                    session.status === 'WAITING' ? '<p style="color: #888; font-size: 11px;">⚪ No trading sessions yet - Start bot to begin</p>' : '';
                
                div.innerHTML = `
                    <p><span class="status-indicator ${statusClass}"></span>${statusText} ${statusIcon}</p>
                    <p><strong>Session:</strong> ${session.session_id}</p>
                    <p><strong>Started:</strong> ${new Date(session.start_time).toLocaleString()}</p>
                    <p><strong>Strategy:</strong> ${session.strategy}</p>
                    <p><strong>Initial Balance:</strong> $${session.initial_balance}</p>
                    ${session.current_balance !== undefined ? `<p><strong>Current Balance:</strong> <span class="price">$${session.current_balance.toFixed(2)}</span></p>` : ''}
                    ${statusMessage}
                `;
            },
            
            updateMarketStatus(market) {
                const div = document.getElementById('market-status');
                if (!market || (!market.current_price && !market.hyperliquid_price)) {
                    div.innerHTML = `
                        <p style="color: #ff9800;">⚠️ Bot Offline</p>
                        <p>Start the trading bot to see live market data</p>
                        <p style="font-size: 11px; color: #888;">Dashboard running in monitoring mode</p>
                    `;
                    return;
                }
                
                const price = market.hyperliquid_price || market.current_price || 0;
                const trendClass = market.trend === 'UP' || market.trend === 'STRONG_UP' ? 'trend-up' : 
                                 market.trend === 'DOWN' || market.trend === 'STRONG_DOWN' ? 'trend-down' : 'trend-neutral';
                
                const rsiValue = market.rsi !== undefined && market.rsi !== null ? market.rsi.toFixed(1) : 'N/A';
                const volumeValue = market.volume_depth !== undefined && market.volume_depth !== null ? market.volume_depth.toFixed(1) : 'N/A';
                // FIX: Remove * 100 - bot already sends as percentage!
                const flowValue = market.orderbook_imbalance !== undefined && market.orderbook_imbalance !== null ? market.orderbook_imbalance.toFixed(1) : 'N/A';
                
                const dataSourceIcon = market.data_source === 'offline_status' ? '⏸️' : '🔴';
                const dataSourceText = market.data_source === 'offline_status' ? 'OFFLINE' : 'LIVE';
                const dataSourceClass = market.data_source === 'offline_status' ? 'warning' : '';
                
                div.innerHTML = `
                    <p><strong>Current Price:</strong> <span class="price ${trendClass}">$${price.toLocaleString()}</span> ${dataSourceIcon}</p>
                    <p><strong>Price Trend:</strong> <span class="${trendClass}">${market.trend}</span></p>
                    <p><strong>Market Condition:</strong> ${market.market_condition}</p>
                    <p style="font-size: 11px; color: #888;"><strong>Data Source:</strong> <span class="${dataSourceClass}">${dataSourceText}</span></p>
                    
                    <div class="market-indicator rsi-indicator" style="margin: 15px 0;">
                        <p><strong>📊 RSI:</strong> 
                        <span class="rsi-value ${market.rsi > 70 ? 'overbought' : market.rsi < 30 ? 'oversold' : 'neutral'}">${rsiValue}</span>
                        ${market.rsi > 70 ? '🔴 OVERBOUGHT' : market.rsi < 30 ? '🟢 OVERSOLD' : '⚪ NEUTRAL'}
                        </p>
                    </div>
                    
                    <div class="market-indicator volume-indicator" style="margin: 15px 0;">
                        <p><strong>📈 Volume:</strong> ${volumeValue} BTC (${market.volume_category || 'UNKNOWN'})</p>
                        <p><strong>📊 Order Flow:</strong> 
                        <span class="${market.orderbook_imbalance > 0.1 ? 'trend-up' : market.orderbook_imbalance < -0.1 ? 'trend-down' : 'trend-neutral'}">${flowValue}%</span>
                        ${market.orderbook_imbalance > 0.1 ? '🟢 BUY PRESSURE' : market.orderbook_imbalance < -0.1 ? '🔴 SELL PRESSURE' : '⚪ BALANCED'}
                        </p>
                    </div>
                    
                    <p><strong>Last Updated:</strong> ${new Date(market.last_update).toLocaleString()}</p>
                `;
            },
            
            updateTradingSummary(summary) {
                const div = document.getElementById('trading-summary');
                const winRate = summary.total_trades > 0 ? ((summary.winning_trades / summary.total_trades) * 100).toFixed(1) : '0.0';
                const balanceChangeClass = summary.balance_change > 0 ? 'trend-up' : 
                                         summary.balance_change < 0 ? 'trend-down' : 'trend-neutral';
                const balanceChangeIcon = summary.balance_change > 0 ? '📈' : 
                                        summary.balance_change < 0 ? '📉' : '➡️';
                
                div.innerHTML = `
                    <p><strong>Total Trades:</strong> ${summary.total_trades}</p>
                    <p><strong>Win Rate:</strong> <span class="${summary.winning_trades > summary.losing_trades ? 'trend-up' : 'trend-down'}">${winRate}%</span> (${summary.winning_trades}W/${summary.losing_trades}L)</p>
                    <p><strong>Initial Balance:</strong> $${summary.initial_balance?.toFixed(2) || 'N/A'}</p>
                    <p><strong>Current Balance:</strong> <span class="price ${balanceChangeClass}">$${summary.current_balance.toFixed(2)}</span></p>
                    <p><strong>P&L:</strong> <span class="${balanceChangeClass}">${balanceChangeIcon} $${summary.balance_change?.toFixed(2) || '0.00'} (${summary.balance_change_pct?.toFixed(2) || '0.00'}%)</span></p>
                `;
            },
            
            updateLatestLogs(logs) {
                const div = document.getElementById('latest-logs');
                if (!logs || logs.length === 0) {
                    div.innerHTML = '<p>No recent activity</p>';
                    return;
                }
                
                let html = '';
                logs.slice(-10).reverse().forEach(log => {
                    const timestamp = log.datetime ? new Date(log.datetime).toLocaleString() : 'Unknown';
                    const type = log.trade_id ? 'trade-entry' : 'signal-entry';
                    const content = log.trade_id ? 
                        `Trade ${log.trade_id}: ${log.side} $${log.price?.toLocaleString() || 'N/A'}` :
                        `${log.reason || 'N/A'}`;
                    
                    html += `<div class="log-entry ${type}">
                        <strong>${timestamp}</strong><br>
                        ${content}
                    </div>`;
                });
                div.innerHTML = html;
            },
            
            updatePredictionsPanel(predictions) {
                const div = document.getElementById('predictions-panel');
                if (!predictions || predictions.length === 0) {
                    div.innerHTML = '<p>No active predictions - Start bot for live signals</p>';
                    return;
                }
                
                const pred = predictions[0]; // Show best prediction
                if (!pred) return;
                
                const sideClass = pred.side === 'BUY' ? 'prediction-buy' : 'prediction-sell';
                const confidenceClass = pred.confidence > 0.7 ? 'high-confidence' : 
                                      pred.confidence > 0.5 ? 'medium-confidence' : 'low-confidence';
                
                div.innerHTML = `
                    <div class="prediction-card ${sideClass} ${confidenceClass}">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span style="font-weight: bold; color: #4CAF50;">${pred.type || 'UNKNOWN'}</span>
                            <span style="font-weight: bold; padding: 2px 8px; border-radius: 4px; background: ${pred.side === 'BUY' ? '#4CAF50' : '#f44336'}; color: white;">${pred.side}</span>
                        </div>
                        <p><strong>Entry Price:</strong> $${pred.entry_price?.toLocaleString() || 'N/A'}</p>
                        <p><strong>Current Price:</strong> $${pred.current_price?.toLocaleString() || 'N/A'}</p>
                        <p><strong>Confidence:</strong> ${(pred.confidence * 100).toFixed(1)}%</p>
                        <p><strong>Timeframe:</strong> ${pred.timeframe || 'N/A'} min</p>
                        <p><strong>Reason:</strong> ${pred.reason || 'N/A'}</p>
                        ${pred.support ? `<p><strong>Support:</strong> $${pred.support.toLocaleString()}</p>` : ''}
                        ${pred.resistance ? `<p><strong>Resistance:</strong> $${pred.resistance.toLocaleString()}</p>` : ''}
                    </div>
                `;
            },
            
            updateOrderbook(orderbook) {
                const div = document.getElementById('orderbook-panel');
                if (!orderbook || orderbook.error || !orderbook.asks || !orderbook.bids) {
                    div.innerHTML = '<p>No orderbook data available</p>';
                    return;
                }
                
                let html = `
                    <div class="orderbook-container">
                        <div class="orderbook-header">
                            <div>Price</div>
                            <div>Size (BTC)</div>
                            <div>Total (BTC)</div>
                        </div>
                `;
                
                // Show asks (sells) - top 5
                orderbook.asks.slice(0, 5).reverse().forEach(ask => {
                    html += `
                        <div class="orderbook-row ask-row">
                            <div class="ask-price">${ask.price.toLocaleString()}</div>
                            <div>${ask.size.toFixed(4)}</div>
                            <div>${ask.total.toFixed(2)}</div>
                        </div>
                    `;
                });
                
                // Spread
                html += `
                    <div class="spread-info">
                        Spread: $${orderbook.spread.toFixed(2)} (${orderbook.spread_pct.toFixed(3)}%)
                    </div>
                `;
                
                // Show bids (buys) - top 5
                orderbook.bids.slice(0, 5).forEach(bid => {
                    html += `
                        <div class="orderbook-row bid-row">
                            <div class="bid-price">${bid.price.toLocaleString()}</div>
                            <div>${bid.size.toFixed(4)}</div>
                            <div>${bid.total.toFixed(2)}</div>
                        </div>
                    `;
                });
                
                html += `</div>`;
                div.innerHTML = html;
            }
        };
        
        // Global functions for compatibility
        function refreshData() {
            DashboardManager.refreshData();
        }
        
        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            DashboardManager.init();
        });
        
        // Initialize immediately if DOM already loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', DashboardManager.init.bind(DashboardManager));
        } else {
            DashboardManager.init();
        }
    </script>
</body>
</html>
